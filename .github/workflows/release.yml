name: Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install WASI target
      run: rustup target add wasm32-wasip1
    - name: Build
      run: cargo build --release --verbose --target wasm32-wasip1
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        WASM: target/wasm32-wasip1/release/harpoon.wasm
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "$WASM" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "$WASM" --generate-notes
        fi
